# Publishes the site after every change on main: an admin save, a Gocha commit or a push from the laptop.
# Builds data/ from content/, stamps the asset references, and uploads to the Hostnodes preview folder over FTP.
# Needs three repository secrets (Settings > Secrets and variables > Actions): FTP_HOST, FTP_USER, FTP_PASSWORD.
# Without them the workflow builds and stops before the upload, so nothing breaks.
name: Deploy preview

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-preview
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build and stage
        run: node tools/stage.js _site

      - name: Upload to bitz.ge/preview/bitz
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::warning::FTP secrets are not set yet; built the site but skipped the upload."
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # size-based mirror for the media (checkout times are always new), never deleting anything on the server;
          # the entry files are then re-sent unconditionally, since a changed hash stamp keeps their size the same
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "
            set ftp:ssl-allow no; set net:max-retries 3; set net:timeout 30;
            mkdir -p -f /public_html/preview/bitz;
            mirror --reverse --ignore-time --parallel=4 --verbose=1 _site /public_html/preview/bitz;
            cd /public_html/preview/bitz;
            put -O . _site/index.html; put -O . _site/app.js; put -O . _site/style.css;
            mirror --reverse --parallel=4 _site/data /public_html/preview/bitz/data;
            quit"
          echo "Published: https://bitz.ge/preview/bitz/"
