# Publishes the site after every change on main: an admin save, a Gocha commit or a push from the laptop.
# Builds data/ from content/, stamps the asset references, and uploads to the Hostnodes preview folder over FTP.
# Needs three repository secrets (Settings > Secrets and variables > Actions): FTP_HOST, FTP_USER, FTP_PASSWORD.
# Without them the workflow builds and stops before the upload, so nothing breaks.
name: Deploy preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # only for committing new bubble previews back

concurrency:
  group: deploy-preview
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # a shot group whose first clip changed (e.g. a clip added in the admin) needs a new bubble preview: make it with ffmpeg
      # and commit it back, so the repository always holds every preview (a push by this workflow does not start another run)
      - name: Bubble previews
        run: |
          if node tools/bubbles.mjs --check; then exit 0; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          node tools/bubbles.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/shots/auto
          if ! git diff --cached --quiet; then
            git commit -q -m "Bubble previews for the shots (automatic)"
            git push -q origin HEAD:main || echo "::warning::could not push the new bubble previews (main moved on); this deploy still includes them and the next run commits them"
          fi

      - name: Build and stage
        run: node tools/stage.js _site

      - name: Upload to bitz.ge/preview/bitz
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::warning::FTP secrets are not set yet; built the site but skipped the upload."
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # size-based mirror for the media (checkout times are always new), never deleting anything on the server;
          # the entry files are then re-sent unconditionally, since a changed hash stamp keeps their size the same
          # every page (one per address), the sitemap, robots and .htaccess are re-sent too: a new asset stamp keeps a page's size the same
          R=/public_html/preview/bitz
          PAGES=$(cd _site && find . -type f \( -name '*.html' -o -name '.htaccess' -o -name 'sitemap.xml' -o -name 'robots.txt' \) | sed 's#^\./##' \
            | while read -r f; do d=$(dirname "$f"); echo "mkdir -p -f $R/$d; put -O $R/$d _site/$f;"; done)
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "
            set ftp:ssl-allow no; set net:max-retries 3; set net:timeout 30;
            mkdir -p -f $R;
            mirror --reverse --ignore-time --parallel=4 --verbose=1 _site $R;
            put -O $R _site/app.js; put -O $R _site/style.css;
            mirror --reverse --parallel=4 _site/data $R/data;
            $PAGES
            quit"
          echo "Published: https://bitz.ge/preview/bitz/"
