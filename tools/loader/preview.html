<!doctype html>
<!-- local preview of the loader animation: http://127.0.0.1:7800/tools/loader/preview.html (?f=<frame> stops on a frame) -->
<meta charset="utf-8"><title>bitz loader preview</title>
<style>html,body{margin:0;height:100%;background:#000;display:grid;place-items:center}#a{width:min(60vw,520px)}</style>
<div id="a"></div>
<script src="../../assets/vendor/lottie_light.min.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  window.anim = lottie.loadAnimation({ container: document.getElementById('a'), renderer: 'svg', loop: !q.has('f'), autoplay: !q.has('f'), path: '../../assets/loader/bitz-write.json' });
  anim.addEventListener('DOMLoaded', () => { if (q.has('f')) anim.goToAndStop(+q.get('f'), true); window.ready = true; });
</script>
